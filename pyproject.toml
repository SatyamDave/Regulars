[project]
name = "regulars"
version = "0.1.0"
description = "Regulars: simulate the conversation, then check it against what happened at dinner."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.40",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=2.0",
    "openai>=1.50",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "stripe>=11",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regulars"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Seeded shuffles and retry jitter; nothing here is a security boundary.
"regulars/assembly/*" = ["S311"]
"regulars/llm/anthropic_client.py" = ["S311"]
# Tests assert, use fixed fake secrets, seeded RNGs, literal paths, and spawn the CLI.
"tests/*" = ["S101", "S105", "S108", "S311", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["regulars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["regulars"]
branch = true
omit = ["regulars/db/gen_ddl.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
